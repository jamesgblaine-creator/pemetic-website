<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Not found — Pemetic Partners</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,600&family=IBM+Plex+Sans:wght@400;600&family=IBM+Plex+Mono:wght@400&display=swap">
<style>
  :root{
    --bg:#EDEFEA; --ink:#15201C; --ink-soft:#48554D; --rule:#C6CBBE; --brass-strong:#6E5518;
    --font-display:'Fraunces','Iowan Old Style',Georgia,serif;
    --font-body:'IBM Plex Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    --font-mono:'IBM Plex Mono',SFMono-Regular,Menlo,monospace;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){ --bg:#121A16; --ink:#E9ECE3; --ink-soft:#A9B2A5; --rule:#333F37; --brass-strong:#E8C36E; }
  }
  :root[data-theme="dark"]{ --bg:#121A16; --ink:#E9ECE3; --ink-soft:#A9B2A5; --rule:#333F37; --brass-strong:#E8C36E; }
  *{box-sizing:border-box;}
  body{
    background:var(--bg); color:var(--ink); font-family:var(--font-body);
    min-height:100vh; margin:0; display:flex; align-items:center; justify-content:center; text-align:center; padding:2rem;
  }
  .wrap{max-width:32rem;}
  p.eyebrow{
    font-family:var(--font-mono); font-size:0.72rem; letter-spacing:0.14em; text-transform:uppercase;
    color:var(--brass-strong); margin:0 0 0.9rem;
  }
  h1{font-family:var(--font-display); font-weight:600; font-size:1.8rem; margin:0 0 0.9rem; line-height:1.2;}
  p.body{color:var(--ink-soft); font-size:1.05rem; margin:0 0 1.6rem; line-height:1.6;}
  a{
    font-family:var(--font-mono); font-size:0.9rem; color:var(--ink-soft); text-decoration:none;
    border-bottom:1px solid var(--rule);
  }
  a:hover{color:var(--brass-strong); border-color:var(--brass-strong);}
</style>
</head>
<body>
  <div class="wrap">
    <p class="eyebrow">Exhibit not found</p>
    <h1>This page doesn&rsquo;t exist.</h1>
    <p class="body">The page you&rsquo;re looking for isn&rsquo;t here — it may have moved, or the link may be off.</p>
    <a href="/">Return to Pemetic Partners</a>
  </div>
</body>
</html>
